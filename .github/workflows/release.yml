name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    outputs:
      version: ${{ steps.version.outputs.version }}
      published: ${{ steps.check_release.outputs.exists == 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build packages
        run: pnpm run build

      # Get version from embed package (main distributable)
      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./packages/embed/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

      # Check if this version tag already exists (to avoid duplicate releases)
      - name: Check if release exists
        id: check_release
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag v${{ steps.version.outputs.version }} already exists, skipping release"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag v${{ steps.version.outputs.version }} does not exist, will create release"
          fi

      # Create Release Pull Request or publish packages
      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run version
          title: 'chore: release packages'
          commit: 'chore: release packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish to npm
      - name: Publish to npm
        if: steps.check_release.outputs.exists == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          pnpm publish -r --access public --no-git-checks
          echo "Published to npm!"

      # Create GitHub Release with tag
      - name: Create GitHub Release
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: |
            ## Scarlett Player v${{ steps.version.outputs.version }}

            See [CHANGELOG](https://github.com/Hackney-Enterprises-Inc/scarlett-player/blob/main/CHANGELOG.md) for details.
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Rebuild demo site with latest player and push to main (triggers Forge deploy)
      - name: Update demo site
        if: steps.check_release.outputs.exists == 'false'
        run: |
          node demo/build.cjs
          if git diff --quiet demo/ docs/demo/; then
            echo "Demo bundle unchanged, skipping commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add demo/demo.bundle.js demo/demo.bundle.js.map docs/demo/demo.bundle.js docs/demo/demo.bundle.js.map
            git commit -m "chore: rebuild demo bundle for v${{ steps.version.outputs.version }} [skip ci]"
            git push
            echo "- Demo site updated" >> $GITHUB_STEP_SUMMARY
          fi

      # Hand the built bundles to the cdn job. Uploading an artifact rather than
      # rebuilding there keeps the two jobs publishing byte-identical files, and
      # lets a failed CDN upload be retried with "Re-run failed jobs" without
      # rebuilding or re-tagging anything.
      - name: Upload CDN payload
        if: steps.check_release.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: cdn-payload
          path: |
            packages/embed/dist/
            packages/embed/iframe.html
          if-no-files-found: error
          retention-days: 30

      # Notify on success
      - name: Release Summary
        if: steps.check_release.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          echo "## Release Published! :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Version: v${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployments:" >> $GITHUB_STEP_SUMMARY
          echo "- npm packages published" >> $GITHUB_STEP_SUMMARY
          echo "- GitHub Release created" >> $GITHUB_STEP_SUMMARY
          echo "- CDN upload runs in the next job" >> $GITHUB_STEP_SUMMARY

  # Publish the embed bundles to the asset CDN (assets.thestreamplatform.com,
  # backed by the tsp-assets bucket on Backblaze B2).
  #
  # This is a separate job on purpose. It used to be a step in the middle of the
  # release job, so when the old MinIO endpoint stopped answering, the upload
  # timed out, failed the job, and silently skipped everything after it: the npm
  # publish, the git tag, the GitHub release and the demo rebuild. That is how
  # v1.1.0 ended up with none of those. Now the CDN is the last thing to run,
  # nothing depends on it, and it can be retried on its own.
  cdn:
    name: Publish to CDN
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.B2_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_SECRET_KEY }}
      # B2 signs against the region embedded in its endpoint (us-east-005 for
      # s3.us-east-005.backblazeb2.com), not us-east-1.
      AWS_DEFAULT_REGION: ${{ secrets.B2_REGION }}
      # The AWS CLI started sending CRC32 integrity headers by default in v2.23.
      # Not every S3-compatible backend accepts them, so only send them where the
      # operation actually requires them. Remove if B2 handles the default fine.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required

    steps:
      - name: Download CDN payload
        uses: actions/download-artifact@v4
        with:
          name: cdn-payload
          path: payload

      - name: Upload to B2
        run: |
          set -euo pipefail

          VERSION="${{ needs.release.outputs.version }}"
          BASE_PATH="s3://${{ secrets.B2_BUCKET }}/scarlett-player"
          ENDPOINT="${{ secrets.B2_ENDPOINT }}"
          DIST="payload/dist"

          echo "Deploying v${VERSION} to the B2 asset CDN..."

          # Upload to both the immutable versioned path and the rolling latest path.
          upload() {
            local src="$1"
            local dest="$2"
            local content_type="${3:-application/javascript}"
            echo "  Uploading ${dest}..."
            # Versioned (immutable, 1 year cache)
            aws s3 cp "$src" "${BASE_PATH}/v${VERSION}/${dest}" \
              --endpoint-url "${ENDPOINT}" \
              --content-type "${content_type}" \
              --cache-control "public, max-age=31536000, immutable"
            # Latest (1 hour cache)
            aws s3 cp "$src" "${BASE_PATH}/latest/${dest}" \
              --endpoint-url "${ENDPOINT}" \
              --content-type "${content_type}" \
              --cache-control "public, max-age=3600"
          }

          # Full build (default - includes everything)
          upload "${DIST}/embed.js" "embed.js"
          upload "${DIST}/embed.umd.cjs" "embed.umd.cjs"

          # Video-only build (lightweight)
          upload "${DIST}/embed.video.js" "embed.video.js"
          upload "${DIST}/embed.video.umd.cjs" "embed.video.umd.cjs"

          # Audio-only build
          upload "${DIST}/embed.audio.js" "embed.audio.js"
          upload "${DIST}/embed.audio.umd.cjs" "embed.audio.umd.cjs"

          # HLS chunk (dynamically loaded by ESM builds)
          upload "${DIST}/hls.js" "hls.js"

          # iframe embed page
          upload "payload/iframe.html" "iframe.html" "text/html"

          echo "Done!"

      # Prove the CDN is actually serving what we just uploaded. A silent
      # no-op upload is the failure mode this whole job exists to prevent.
      - name: Verify CDN
        run: |
          set -euo pipefail

          VERSION="${{ needs.release.outputs.version }}"
          CDN="https://assets.thestreamplatform.com/scarlett-player"

          for path in "v${VERSION}/embed.umd.cjs" "latest/embed.umd.cjs"; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "${CDN}/${path}")
            echo "  ${path} -> ${status}"
            if [ "$status" != "200" ]; then
              echo "CDN did not serve ${path} (HTTP ${status})"
              exit 1
            fi
          done

      - name: CDN Summary
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          CDN="https://assets.thestreamplatform.com/scarlett-player"

          echo "## CDN Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Versioned:** \`${CDN}/v${VERSION}/\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Latest:** \`${CDN}/latest/\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Available builds:" >> $GITHUB_STEP_SUMMARY
          echo "| Build | File | Description |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|------|-------------|" >> $GITHUB_STEP_SUMMARY
          echo "| Full | \`embed.umd.cjs\` | Video + Audio + Analytics + Playlist + Media Session |" >> $GITHUB_STEP_SUMMARY
          echo "| Video | \`embed.video.umd.cjs\` | Video player only (lightweight) |" >> $GITHUB_STEP_SUMMARY
          echo "| Audio | \`embed.audio.umd.cjs\` | Audio player + Playlist + Media Session |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Usage:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`html" >> $GITHUB_STEP_SUMMARY
          echo "<script src=\"${CDN}/latest/embed.umd.cjs\"></script>" >> $GITHUB_STEP_SUMMARY
          echo "<div data-scarlett-player data-src=\"video.m3u8\"></div>" >> $GITHUB_STEP_SUMMARY
          echo "<div data-scarlett-player data-src=\"audio.m3u8\" data-type=\"audio\"></div>" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Required for npm trusted publishing (OIDC). Without it no OIDC token is
      # minted, npm falls back to token auth, and an unauthorised PUT comes back
      # as a 404 that reads like the package does not exist.
      id-token: write

    outputs:
      version: ${{ steps.version.outputs.version }}
      published: ${{ steps.check_release.outputs.exists == 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No version pin here on purpose: action-setup reads packageManager from
      # package.json (pnpm@10.25.0). CI was installing pnpm 8 against a v9
      # lockfile, and pnpm 8 cannot do OIDC publishing at all.
      #
      # Do NOT move to pnpm 11 yet. pnpm 11.0.8 regressed OIDC publishing and
      # fails with the same misleading 404 (pnpm/pnpm#11513). 10.x is correct.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      # Node 24: trusted publishing needs >= 22.14, and 20 is deprecated on
      # GitHub runners, which were force-upgrading these actions to 24 anyway.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build packages
        run: pnpm run build

      # Gate the publish on the tarballs actually containing what their
      # manifests promise. v1.7.0 went out with @scarlett-player/embed and
      # @scarlett-player/vue both declaring `types: ./dist/index.d.ts` and
      # neither tarball containing a single .d.ts (checked with npm pack
      # --dry-run on 2026-09-02): a Vite emptyOutDir deleted the declarations
      # tsc had just emitted and the build stayed green. What that costs the
      # consumer depends on its own settings, measured on TypeScript 5.9.3:
      # with noImplicitAny on, which is what strict gives you, the import does
      # not compile at all (TS7016); with it off the module is typed any and
      # nothing is reported. Deliberately before "Publish to npm" and not
      # continue-on-error: a package whose advertised files are missing must
      # not reach the registry, because a published version cannot be
      # replaced.
      - name: Check package artifacts
        run: node scripts/check-package-artifacts.mjs

      # Get version from embed package (main distributable)
      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./packages/embed/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

      # Check if this version tag already exists (to avoid duplicate releases)
      - name: Check if release exists
        id: check_release
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag v${{ steps.version.outputs.version }} already exists, skipping release"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag v${{ steps.version.outputs.version }} does not exist, will create release"
          fi

      # Create Release Pull Request or publish packages
      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run version
          title: 'chore: release packages'
          commit: 'chore: release packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish to npm.
      #
      # continue-on-error because npm, the demo site and the CDN are independent
      # publish targets. A failure here used to abort the job and silently skip
      # the tag, the demo rebuild and the CDN. The "Publish results" step at the
      # end still fails the job, so nothing goes green half-finished.
      # Authentication is npm trusted publishing (OIDC). There is deliberately no
      # token and no ~/.npmrc: pnpm exchanges the workflow's OIDC identity for a
      # short-lived credential, which npm matches against the trusted publisher
      # configured on each package (this repo + release.yml). Provenance
      # attestations are generated automatically, so no --provenance flag.
      #
      # Every package published here needs its own trusted publisher entry on
      # npmjs.com. A package without one fails with a 404, the same misleading
      # code npm uses for any unauthorised PUT.
      # Published one package at a time on purpose, rather than `pnpm publish -r`.
      # Recursive publish stops at the first rejection, so on 2026-08-11 a single
      # unauthorised package (a new one, with no trusted publisher entry yet)
      # aborted the run and left the other 15 unpublished at the previous
      # version while the repo was already versioned past it. One package
      # missing an entry must cost that package, not the whole release.
      #
      # pnpm, never npm, for the publish itself: pnpm rewrites `workspace:*`
      # into real version ranges when it packs. `npm publish` ships those
      # manifests verbatim, and every install of @scarlett-player/embed would
      # then fail on an unresolvable dependency.
      - name: Publish to npm
        id: npm_publish
        if: steps.check_release.outputs.exists == 'false'
        continue-on-error: true
        run: |
          set -uo pipefail

          echo "Publishing via OIDC trusted publishing (pnpm $(pnpm --version), node $(node --version))"

          published=()
          skipped=()
          failed=()

          # name<TAB>version for every publishable workspace package.
          while IFS=$'\t' read -r name version; do
            [ -z "$name" ] && continue

            # Already on the registry: a re-run after a partial failure has to be
            # able to finish the job rather than tripping over its own success.
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "= ${name}@${version} already published, skipping"
              skipped+=("${name}@${version}")
              continue
            fi

            if pnpm publish --filter "${name}" --access public --no-git-checks; then
              echo "+ ${name}@${version} published"
              published+=("${name}@${version}")
            else
              echo "! ${name}@${version} FAILED (a 404 here means no trusted publisher entry yet)"
              failed+=("${name}@${version}")
            fi
          done < <(pnpm list -r --depth -1 --json | node -e "
            let raw = '';
            process.stdin.on('data', (chunk) => { raw += chunk; });
            process.stdin.on('end', () => {
              for (const pkg of JSON.parse(raw)) {
                if (!pkg.name || pkg.private) continue;
                if (pkg.name === 'scarlett-player-workspace') continue;
                process.stdout.write(pkg.name + '\t' + pkg.version + '\n');
              }
            });
          ")

          {
            echo "## npm"
            echo ""
            echo "| Result | Count |"
            echo "|--------|-------|"
            echo "| published | ${#published[@]} |"
            echo "| already published | ${#skipped[@]} |"
            echo "| failed | ${#failed[@]} |"
          } >> $GITHUB_STEP_SUMMARY

          if [ ${#failed[@]} -gt 0 ]; then
            echo ""
            echo "Failed to publish: ${failed[*]}"
            echo "Add a trusted publisher entry (this repo + release.yml) for each on npmjs.com,"
            echo "then re-run this job. Packages that already succeeded are skipped on the retry."
            printf '\n**Failed:** `%s`\n' "${failed[*]}" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "Published to npm!"

      # Rebuild demo site with latest player and push to main (triggers Forge deploy).
      #
      # Deliberately NOT gated on this being a release. The demo should reflect
      # main, not the last tagged version: before this, merging a player fix
      # without a version bump left scarlettplayer.com stale until the next
      # release unless the author hand-built the bundle and committed it.
      # Contributors no longer need to do that, see CLAUDE.md.
      - name: Update demo site
        id: demo
        continue-on-error: true
        run: |
          node demo/build.cjs

          # The bundle must be trackable, not merely present on disk. On
          # 2026-08-11 both bundles were added to .gitignore to stop branch
          # authors committing them; `git add demo/ docs/demo/` then skipped
          # them without a word while the stamped index.html still committed,
          # so scarlettplayer.com served a script tag pointing at a file that
          # was no longer in the repo and the demo 404'd until someone noticed.
          # Fail here instead: the step is continue-on-error, and "Publish
          # results" reads steps.demo.outcome, so this reports rather than
          # aborting the rest of the release.
          for bundle in demo/demo.bundle.js docs/demo/demo.bundle.js; do
            if [ ! -s "$bundle" ]; then
              echo "::error::$bundle missing or empty after build"
              exit 1
            fi
            if git check-ignore -q "$bundle"; then
              echo "::error::$bundle is gitignored, so the deployed index.html would point at a file this commit cannot ship"
              exit 1
            fi
          done

          if git diff --quiet demo/ docs/demo/; then
            echo "Demo bundle unchanged, skipping commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            # Whole directories, matching the git diff check above. The build
            # also stamps ?v=<version> onto the script tag in each index.html,
            # and an explicit file list would silently leave that out.
            git add demo/ docs/demo/
            git commit -m "chore: rebuild demo bundle for v${{ steps.version.outputs.version }} [skip ci]"
            git push
            echo "- Demo site updated" >> $GITHUB_STEP_SUMMARY
          fi

      # Hand the built bundles to the cdn job. Uploading an artifact rather than
      # rebuilding there keeps the two jobs publishing byte-identical files, and
      # lets a failed CDN upload be retried with "Re-run failed jobs" without
      # rebuilding or re-tagging anything.
      - name: Upload CDN payload
        if: steps.check_release.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: cdn-payload
          path: |
            packages/embed/dist/
            packages/embed/iframe.html
          if-no-files-found: error
          retention-days: 30

      # Create the GitHub Release, and with it the tag.
      #
      # Deliberately last, and gated on npm having succeeded. The tag is what
      # "Check if release exists" reads, so it is the idempotency marker for the
      # whole workflow: creating it while npm was still broken would make every
      # retry a no-op and strand the version permanently unpublished.
      - name: Create GitHub Release
        id: gh_release
        if: steps.check_release.outputs.exists == 'false' && steps.npm_publish.outcome == 'success'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: |
            ## Scarlett Player v${{ steps.version.outputs.version }}

            See [CHANGELOG](https://github.com/Hackney-Enterprises-Inc/scarlett-player/blob/main/CHANGELOG.md) for details.
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Report what each independent target actually did, then fail the job if
      # any of them failed. Every target has already had its chance to run by
      # this point, so one broken target no longer hides the others.
      #
      # Runs on every push, not just releases: the demo step is now unconditional
      # and carries continue-on-error, so without this a demo failure on an
      # ordinary merge would leave the job green with a stale demo site.
      #
      # "skipped" is not a failure. On a non-release push npm and the tag are
      # legitimately skipped and only the demo runs.
      - name: Publish results
        if: always()
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          RELEASING="${{ steps.check_release.outputs.exists == 'false' }}"
          NPM="${{ steps.npm_publish.outcome }}"
          DEMO="${{ steps.demo.outcome }}"
          TAG="${{ steps.gh_release.outcome }}"

          if [ "$RELEASING" = "true" ]; then
            heading="Release v${VERSION}"
            cdn="runs in the next job"
          else
            heading="Demo update (v${VERSION} already released)"
            cdn="skipped, not a release"
          fi

          {
            echo "## ${heading}"
            echo ""
            echo "| Target | Result |"
            echo "|--------|--------|"
            echo "| npm | ${NPM} |"
            echo "| demo site | ${DEMO} |"
            echo "| GitHub release + tag | ${TAG} |"
            echo "| CDN | ${cdn} |"
          } >> $GITHUB_STEP_SUMMARY

          if [ "$NPM" = "failure" ] || [ "$DEMO" = "failure" ]; then
            echo ""
            echo "One or more targets failed. No tag was created, so a re-run of"
            echo "this workflow will retry every target once the cause is fixed."
            exit 1
          fi

  # Publish the embed bundles to TSP Assets (assets.thestreamplatform.com, the
  # tsp-assets bucket on Backblaze B2).
  #
  # This is a separate job on purpose. It used to be a step in the middle of the
  # release job, so when the old MinIO endpoint stopped answering, the upload
  # failed the job and silently skipped everything after it: the npm publish,
  # the git tag, the GitHub release and the demo rebuild. That is why v1.1.0 and
  # v1.1.1 have none of those. Now nothing depends on the CDN, and this job can
  # be retried on its own with "Re-run failed jobs".
  #
  # The B2_* values are owned by Doppler and mirrored into this repository's
  # GitHub secrets by the Doppler GitHub Actions sync, so they are read here as
  # ordinary secrets. Doppler stays the place you edit them; the sync pushes the
  # change to GitHub. Never hand-edit them in the GitHub UI, the next sync would
  # overwrite it.
  #
  # The upload itself lives in scripts/upload-cdn.sh so that a local publish and
  # a CI publish run identical code. Locally, go through Doppler directly:
  #   doppler run -- ./scripts/upload-cdn.sh 1.1.1
  cdn:
    name: Deploy to TSP Assets
    needs: release
    # always() so a failure in another publish target (npm, most likely) does not
    # skip this one. The CDN does not depend on npm in any way.
    if: always() && needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Restores packages/embed/dist/ and packages/embed/iframe.html, the paths
      # the upload script expects.
      - name: Download CDN payload
        uses: actions/download-artifact@v4
        with:
          name: cdn-payload
          path: packages/embed

      # The script validates every required B2_* value up front and verifies the
      # CDN actually serves the result, so a secret that failed to sync fails
      # with a message naming it instead of an empty --endpoint-url deep in the
      # upload, which is how this broke before.
      - name: Deploy to TSP Assets
        env:
          B2_ACCESS_KEY: ${{ secrets.B2_ACCESS_KEY }}
          B2_SECRET_KEY: ${{ secrets.B2_SECRET_KEY }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_REGION: ${{ secrets.B2_REGION }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: ./scripts/upload-cdn.sh "${{ needs.release.outputs.version }}"

      - name: CDN Summary
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          CDN="https://assets.thestreamplatform.com/scarlett-player"

          echo "## Published to TSP Assets" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Versioned:** \`${CDN}/v${VERSION}/\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Latest:** \`${CDN}/latest/\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Available builds:" >> $GITHUB_STEP_SUMMARY
          echo "| Build | File | Description |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|------|-------------|" >> $GITHUB_STEP_SUMMARY
          echo "| Full | \`embed.umd.cjs\` | Video + Audio + Analytics + Playlist + Media Session |" >> $GITHUB_STEP_SUMMARY
          echo "| Video | \`embed.video.umd.cjs\` | Video player only (lightweight) |" >> $GITHUB_STEP_SUMMARY
          echo "| Audio | \`embed.audio.umd.cjs\` | Audio player + Playlist + Media Session |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Usage:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`html" >> $GITHUB_STEP_SUMMARY
          echo "<script src=\"${CDN}/latest/embed.umd.cjs\"></script>" >> $GITHUB_STEP_SUMMARY
          echo "<div data-scarlett-player data-src=\"video.m3u8\"></div>" >> $GITHUB_STEP_SUMMARY
          echo "<div data-scarlett-player data-src=\"audio.m3u8\" data-type=\"audio\"></div>" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

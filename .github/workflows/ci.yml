name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No version pin on purpose: action-setup reads packageManager from
      # package.json (pnpm@10.25.0). The old pin installed pnpm 8, which
      # cannot read the v9 lockfile, so this job died at install and tests
      # never ran. release.yml got this fix during the trusted-publishing
      # migration; this file is the same fix applied to CI.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      # Catches a manifest that advertises a file the build did not leave on
      # disk: @scarlett-player/embed@1.7.0 and @scarlett-player/vue@1.7.0 both
      # shipped with `types` pointing at a .d.ts that a Vite emptyOutDir had
      # deleted (confirmed against both tarballs on 2026-09-02), and both
      # publishes were green.
      - name: Check package artifacts
        run: node scripts/check-package-artifacts.mjs

      # Catches an embed bundle importing a chunk the build did not emit: the
      # audio build's second chunk was named hls2.js and never uploaded, so it
      # 404'd on the CDN from the v1.6.0 release (2026-08-11) through v1.7.0,
      # still reproducible 2026-09-02, while every build stayed green.
      - name: Check embed chunks
        run: node scripts/check-embed-chunks.mjs

      # Catches a declaration file that exists but does not compile for a
      # consumer: @scarlett-player/vue@1.8.1 shipped a dist/index.d.ts opening
      # with `import ... from './ScarlettPlayer.vue'`, a path the package does
      # not publish, so every consumer TypeScript build broke while the file
      # itself was present and every check above stayed green.
      - name: Check package types
        run: node scripts/check-package-types.mjs

      # Catches a package with no `typecheck` or `test` script. pnpm's recursive
      # run skips those silently, so the two steps below would pass vacuously
      # for it, which is how ten packages went unchecked.
      - name: Check package scripts
        run: node scripts/check-package-scripts.mjs

      - name: Type check
        run: pnpm run typecheck

      # NODE_OPTIONS works around a teardown crash, not a test failure. Node 24
      # enables require(esm) by default; vitest 1.6 predates it, and the two race
      # when vitest tears down its worker threads at the end of a run. A module
      # load still in flight lands in Node's native CJS lexer, which calls
      # ToLocalChecked() on a string V8 will not hand back for an isolate that is
      # going away, and aborts the process (SIGABRT -> exit 134). Every test has
      # already passed by then; the job dies during cleanup. Disabling
      # require(esm) removes that code path entirely. Node cannot be pinned back
      # instead - release.yml needs >= 22.14 for trusted publishing. Remove this
      # once vitest is upgraded to 3.x, which supports Node 24.
      - name: Run tests
        run: pnpm run test
        env:
          NODE_OPTIONS: --no-experimental-require-module

      # ---- Real-browser verification: push to main only ----
      #
      # jsdom has no layout engine and no MSE, so three classes of defect are
      # untestable in the suites above and are only covered here: the control
      # bar's overflow/fit arithmetic (measured with getBoundingClientRect,
      # which is 0x0 in jsdom and stubbed by hand from numbers someone read off
      # a real browser), the built UMD bundle's window.ScarlettPlayer surface
      # (the embed unit tests mock core and never load a bundle), and MSE
      # teardown races under real hls.js. The mock-drift case itself - a handler
      # reading `data.url` for an error type hls.js never sets it on, which
      # passed every mocked test while the diagnostic was broken in production -
      # is covered cheaply by packages/plugins/hls/tests/integration.test.ts in
      # the run above, so it does not need this job.
      #
      # Gated to `push` rather than run on every pull request, deliberately.
      # The harness takes ~3.5 minutes before the Chromium install, and several
      # scenarios assert against fixed waits tuned on a developer machine
      # (outage recovery, reconnect, six sequential page loads). It has never
      # run on a CI runner, so its flake rate under CI load is unknown, and a
      # flaky required check is worse than no check: people learn to re-run it
      # and stop reading it. Running on merge keeps it exercised - which is the
      # point, it previously ran nowhere and was rotting - at no cost to PR
      # turnaround. Move the condition to `pull_request` once a few weeks of
      # main runs show it is stable.
      - name: Install Playwright Chromium
        if: github.event_name == 'push'
        run: npx playwright install --with-deps chromium

      - name: Generate HLS fixture
        if: github.event_name == 'push'
        run: node scripts/hls-fixture.mjs

      - name: Run headless browser verification
        if: github.event_name == 'push'
        run: |
          node demo/build.cjs
          python3 -m http.server 8899 --bind 127.0.0.1 &
          echo $! > /tmp/http.pid
          node scripts/verify-browser.mjs
          kill "$(cat /tmp/http.pid)"

      # The harness needs a built demo bundle, and CI's demo-bundle commit
      # belongs to release.yml alone. Leaving the rebuild in the working tree
      # here would let a later step pick it up.
      - name: Discard the rebuilt demo bundle
        if: always() && github.event_name == 'push'
        run: git checkout -- demo/demo.bundle.js docs/demo/demo.bundle.js || true

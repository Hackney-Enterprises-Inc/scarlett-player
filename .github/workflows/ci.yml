name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    # This job only reads the repository - it lints, builds and tests. Stated
    # explicitly rather than inheriting the repository or organization default,
    # so widening that default later cannot hand a write-scoped token to a
    # pull_request run of untrusted branch code.
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Nothing in this job pushes, and `pnpm install` below runs lifecycle
          # scripts out of the pull request's own tree. Left at the default,
          # checkout writes the GITHUB_TOKEN into .git/config, where any of
          # those scripts could read it. release.yml keeps the default because
          # it does push the demo bundle.
          persist-credentials: false

      # No version pin on purpose: action-setup reads packageManager from
      # package.json (pnpm@10.25.0). The old pin installed pnpm 8, which
      # cannot read the v9 lockfile, so this job died at install and tests
      # never ran. release.yml got this fix during the trusted-publishing
      # migration; this file is the same fix applied to CI.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      # Catches a manifest that advertises a file the build did not leave on
      # disk: @scarlett-player/embed@1.7.0 and @scarlett-player/vue@1.7.0 both
      # shipped with `types` pointing at a .d.ts that a Vite emptyOutDir had
      # deleted (confirmed against both tarballs on 2026-09-02), and both
      # publishes were green.
      - name: Check package artifacts
        run: node scripts/check-package-artifacts.mjs

      # Catches an embed bundle importing a chunk the build did not emit: the
      # audio build's second chunk was named hls2.js and never uploaded, so it
      # 404'd on the CDN from the v1.6.0 release (2026-08-11) through v1.7.0,
      # still reproducible 2026-09-02, while every build stayed green.
      - name: Check embed chunks
        run: node scripts/check-embed-chunks.mjs

      # Catches a declaration file that exists but does not compile for a
      # consumer: @scarlett-player/vue@1.8.1 shipped a dist/index.d.ts opening
      # with `import ... from './ScarlettPlayer.vue'`, a path the package does
      # not publish, so every consumer TypeScript build broke while the file
      # itself was present and every check above stayed green.
      - name: Check package types
        run: node scripts/check-package-types.mjs

      # Catches a package with no `typecheck` or `test` script. pnpm's recursive
      # run skips those silently, so the two steps below would pass vacuously
      # for it, which is how ten packages went unchecked.
      - name: Check package scripts
        run: node scripts/check-package-scripts.mjs

      - name: Type check
        run: pnpm run typecheck

      # NODE_OPTIONS works around a teardown crash, not a test failure. Node 24
      # enables require(esm) by default; vitest 1.6 predates it, and the two race
      # when vitest tears down its worker threads at the end of a run. A module
      # load still in flight lands in Node's native CJS lexer, which calls
      # ToLocalChecked() on a string V8 will not hand back for an isolate that is
      # going away, and aborts the process (SIGABRT -> exit 134). Every test has
      # already passed by then; the job dies during cleanup. Disabling
      # require(esm) removes that code path entirely. Node cannot be pinned back
      # instead - release.yml needs >= 22.14 for trusted publishing. Remove this
      # once vitest is upgraded to 3.x, which supports Node 24.
      - name: Run tests
        run: pnpm run test
        env:
          NODE_OPTIONS: --no-experimental-require-module

      # Renders every documentation page and agent file in memory and writes
      # nothing. The build that writes them (demo/build.cjs) runs only on
      # push, below, so without this a guide link to a missing file, raw HTML
      # the renderer refuses, or a malformed README "## Packages" table would
      # pass review and first fail on main. Cheap (no browser), so it runs
      # on pull requests too.
      - name: Check documentation build
        run: node demo/docs-build.mjs --check

      # ---- Real-browser verification: push to main only ----
      #
      # jsdom has no layout engine and no MSE, so three classes of defect are
      # untestable in the suites above and are only covered here: the control
      # bar's overflow/fit arithmetic (measured with getBoundingClientRect,
      # which is 0x0 in jsdom and stubbed by hand from numbers someone read off
      # a real browser), the built UMD bundle's window.ScarlettPlayer surface
      # (the embed unit tests mock core and never load a bundle), and MSE
      # teardown races under real hls.js. The mock-drift case itself - a handler
      # reading `data.url` for an error type hls.js never sets it on, which
      # passed every mocked test while the diagnostic was broken in production -
      # is covered cheaply by packages/plugins/hls/tests/integration.test.ts in
      # the run above, so it does not need this job.
      #
      # Gated to `push` rather than run on every pull request, deliberately.
      # The harness takes ~3.5 minutes before the Chromium install, and several
      # scenarios assert against fixed waits tuned on a developer machine
      # (outage recovery, reconnect, six sequential page loads). It has never
      # run on a CI runner, so its flake rate under CI load is unknown, and a
      # flaky required check is worse than no check: people learn to re-run it
      # and stop reading it. Running on merge keeps it exercised - which is the
      # point, it previously ran nowhere and was rotting - at no cost to PR
      # turnaround. Move the condition to `pull_request` once a few weeks of
      # main runs show it is stable.
      - name: Install Playwright Chromium
        if: github.event_name == 'push'
        run: npx playwright install --with-deps chromium

      # scripts/hls-fixture.mjs shells out to a real ffmpeg. The GitHub-hosted
      # ubuntu-24.04 image does not carry one (ffmpeg was dropped from the
      # runner image), and Playwright's bundled build is a private binary under
      # ~/.cache/ms-playwright that is never put on PATH, so the step below
      # died with "ffmpeg is not on PATH" on every push to main from the day
      # this job was added. Installed explicitly rather than relying on the
      # image.
      - name: Install ffmpeg
        if: github.event_name == 'push'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Generate HLS fixture
        if: github.event_name == 'push'
        run: node scripts/hls-fixture.mjs

      # Two harnesses against the same server and the same build. The site
      # harness (scripts/verify-site.mjs) drives the homepage, both demo
      # routes (through every scenario hash) and the five generated
      # documentation pages at seven viewport widths, fetches every asset
      # and every in-site link the pages reference from the local tree, and
      # holds docs/sitemap.xml to that same route list. A stylesheet or
      # poster that resolves to the wrong path, an image left on a hosted
      # origin, a guide link to a slug that does not exist, or a page
      # missing from the sitemap fails here rather than on
      # scarlettplayer.com. Same push-only gating as the playback harness:
      # it needs the Chromium install above, and runs on merge.
      - name: Run headless browser verification
        if: github.event_name == 'push'
        run: |
          node demo/build.cjs
          python3 -m http.server 8899 --bind 127.0.0.1 &
          echo $! > /tmp/http.pid
          node scripts/verify-browser.mjs
          node scripts/verify-site.mjs
          kill "$(cat /tmp/http.pid)"

      # The harnesses need a built demo, and CI's demo commit belongs to
      # release.yml alone. Leaving the rebuild in the working tree here would
      # let a later step pick it up. Covers every TRACKED path build.cjs
      # writes: the two bundles, the version stamps on demo/index.html and
      # docs/index.html, the generated docs/demo/index.html, the site.css and
      # assets/ mirrors beside each generated page, and the homepage entry
      # under docs/site/, and the documentation pages demo/docs-build.mjs
      # renders into docs/documentation/, docs/architecture/,
      # docs/plugin-authoring/, docs/embed/ and docs/contributing/ (the
      # directories only: the authored .md files beside them are never
      # written by the build; each directory also holds the guide's
      # generated index.md), and docs/llms.txt + docs/llms-full.txt at the
      # site root. The .map files are gitignored, and naming an
      # untracked path in a single `git checkout` would make it reject the
      # whole pathspec list and restore nothing - hence one call per path,
      # each allowed to fail on its own. `git clean` then removes what the
      # build created rather than rewrote: a hashed chunk under docs/site/
      # whose name changed, an asset mirrored for the first time, or a
      # documentation directory on the first build after it was added,
      # before the release bot has ever committed it.
      - name: Discard the rebuilt demo
        if: always() && github.event_name == 'push'
        run: |
          for path in \
            demo/demo.bundle.js demo/index.html demo/site.css demo/assets \
            docs/demo/demo.bundle.js docs/demo/index.html docs/demo/site.css docs/demo/assets \
            docs/index.html docs/site \
            docs/documentation/ docs/architecture/ docs/plugin-authoring/ docs/embed/ docs/contributing/ \
            docs/llms.txt docs/llms-full.txt; do
            git checkout -- "$path" 2>/dev/null || true
          done
          git clean -fdq -- demo/assets docs/demo/assets docs/site \
            docs/documentation/ docs/architecture/ docs/plugin-authoring/ docs/embed/ docs/contributing/ \
            docs/llms.txt docs/llms-full.txt || true
